[package]
name = "baton"
version = "0.1.0"
edition = "2021"
description = "Baton Desktop (Tauri shell)"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
baton-core = { path = "../core" }

# 说明：Tauri 壳负责启动内嵌的 core server 并把 WebView 指向前端。
# 首次 `cargo build` 会编译 tauri 全量依赖（较久），骨架阶段可先用
# `cargo run -p baton-core` + `npm --prefix web run dev` 开发调试。
