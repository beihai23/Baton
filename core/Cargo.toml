[package]
name = "baton-core"
version = "0.1.0"
edition = "2021"
description = "Baton Core Server — local-first agent-native kanban core"

[lib]
name = "baton_core"
path = "src/lib.rs"

[[bin]]
name = "baton-core"
path = "src/main.rs"

[[bin]]
name = "baton-mcp"
path = "src/bin/mcp.rs"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
